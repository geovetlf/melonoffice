name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # User persistence is tested against the Firestore emulator (ADR-0017), pinned by version
      # and checksum. It needs Java 21, which the runner image ships.
      - name: Start the Firestore emulator
        env:
          EMULATOR_VERSION: 1.22.0
          EMULATOR_SHA256: 9b6498b7f62714d67f48f59b3818883cd682dbcd46b9f59511de81c97bb5166c
        run: |
          jar="$RUNNER_TEMP/firestore-emulator.jar"
          curl --fail --silent --show-error --location --retry 3 -o "$jar" \
            "https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v${EMULATOR_VERSION}.jar"
          echo "${EMULATOR_SHA256}  ${jar}" | sha256sum --check
          nohup "${JAVA_HOME_21_X64}/bin/java" -jar "$jar" --host 127.0.0.1 --port 8085 \
            > "$RUNNER_TEMP/firestore-emulator.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl --silent --output /dev/null http://127.0.0.1:8085 && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/firestore-emulator.log"
          exit 1
      - run: pnpm test
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
          # The Firestore tests fail instead of skipping if the emulator is missing.
          REQUIRE_FIRESTORE_EMULATOR: '1'
      - run: pnpm build
      # The forecaster's contract and server (ADR-0059), with a fake model: no torch needed.
      - name: Test the forecaster
        run: python3 -m unittest discover -s apps/forecaster/tests -t apps/forecaster

  terraform:
    name: Terraform format, validate, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      # No credentials and no backend: validation and the mocked module tests are offline.
      - name: Validate environments
        run: |
          for env in dev staging prod; do
            terraform -chdir="infra/envs/${env}" init -backend=false -input=false
            terraform -chdir="infra/envs/${env}" validate
          done
      - name: Check environment isolation
        run: infra/scripts/check-environments.sh
      - name: Test the modules
        run: |
          for module in environment github_oidc; do
            terraform -chdir="infra/modules/${module}" init -input=false
            terraform -chdir="infra/modules/${module}" test
          done

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action lists the pull request's commits to choose the scan range.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
