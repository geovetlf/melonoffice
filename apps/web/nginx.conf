# Serves the Vite build of apps/web. Cloud Run terminates TLS in front of this server.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;
  absolute_redirect off;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  # Liveness endpoint for Cloud Run probes and the CD health check.
  location = /health {
    default_type application/json;
    return 200 '{"status":"ok","service":"web"}';
  }

  # Hashed build assets never change, so browsers may cache them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Single-page app: unknown paths serve index.html, which is never cached.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri /index.html;
  }
}
